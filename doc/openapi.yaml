openapi: 3.1.0

info:
  title: tlstap API
  version: 0.3.0
  description: |
    REST API exposed by the tlstap TLS intercepting proxy when the `dbdump`
    and/or `tamper` interceptors are active and `"api": {"listen": "..."}` is
    set in `config.json`.

    **Base path:** All endpoints are reachable at the canonical path
    `/api/i/<interceptor-name>/<endpoint>` as well as the proxy-scoped path
    `/<proxyName>/api/i/<interceptor-name>/<endpoint>`.

    **Errors:** All error responses use `Content-Type: application/json` and the
    body `{"error": "<message>"}` with an appropriate HTTP status code.

    **Request validation:** a `400` on a JSON endpoint reliably means the body failed
    to *parse* (malformed JSON, wrong field type). A `required` field in a request
    schema below documents the field a well-formed request is expected to supply —
    omitting it is not otherwise rejected; the handler just runs with that field's zero
    value (`0`, `""`, `false`, or an empty array), which is occasionally the correct,
    documented behavior (e.g. `/chunk`'s `chunks`) and occasionally just an
    unintentionally-permissive gap. Don't rely on a missing required field producing
    an error.

    **dbdump vs. tamper:** `dbdump` passively records traffic to SQLite and
    exposes a pull/replay history API. `tamper` is a separate, live-only
    interceptor that lets a connected control client pause, edit, drop, or
    forward individual chunks (or just watch them), with no persistence of its
    own. The two are composed via a proxy's `interceptors` list, not merged —
    see CLAUDE.md's "tamper Interceptor" section for the full rationale. Both
    share a proxy's `ConnID` numbering, so a `dbdump` stream and its live
    `tamper` state can be correlated by `conn` alone.

servers:
  - url: http://127.0.0.1:9090
    description: Default local API server (address configurable via config.json)

tags:
  - name: status
    description: Health check
  - name: sessions
    description: Capture sessions
  - name: streams
    description: TCP streams within a session
  - name: chunks
    description: Raw traffic chunks within a stream
  - name: search
    description: Pattern search across captured traffic
  - name: tamper
    description: Live traffic interception (hold, edit, drop, forward, or watch)
  - name: scripts
    description: >-
      Storage for scripts driving programmatic tamper interception. Execution is
      client-side only (a browser Web Worker via the "Scripts" sub-tab of the Tamper
      view) — these endpoints are just the REST CRUD backing that store.
  - name: framer
    description: >-
      Storage for framer scripts (reassemble a stream's raw chunks into logical
      frames) and the persisted frame index they produce, so a stream can be
      viewed partitioned by frame instead of by raw chunk, both directions
      merged chronologically. Execution is client-side only (a browser Web
      Worker) — these endpoints are the REST CRUD backing script storage plus
      reading/extending the computed result. See CLAUDE.md's "Framer scripts"
      section and doc/design/packet-dissector.md for the wider design.
  - name: fs
    description: >-
      Scoped read/write/list access to one host directory (`fs-root`), for a
      running script to read fixtures or persist artifacts. See CLAUDE.md's
      "Filesystem access" section.
  - name: ui
    description: Embedded web frontend

paths:

  /api/i/dbdump/status:
    get:
      tags: [status]
      summary: Health check
      operationId: getStatus
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /api/i/dbdump/sessions:
    get:
      tags: [sessions]
      summary: List all capture sessions
      operationId: getSessions
      responses:
        '200':
          description: Ordered list of sessions (oldest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/i/dbdump/streams:
    post:
      tags: [streams]
      summary: List streams belonging to a session
      operationId: getStreams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session]
              properties:
                session:
                  type: integer
                  format: int64
                  description: Session ID
      responses:
        '200':
          description: Ordered list of streams (by stream ID)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Stream'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/i/dbdump/chunklist:
    post:
      tags: [chunks]
      summary: Get latest chunk IDs and total byte counts for a stream
      description: |
        Returns the ID of the most recently captured chunk and the total number
        of captured bytes for each direction.
      operationId: getChunkList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session, stream]
              properties:
                session:
                  type: integer
                  format: int64
                  description: Session ID
                stream:
                  type: integer
                  format: int64
                  description: Stream ID
      responses:
        '200':
          description: Latest chunk metadata per direction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/i/dbdump/latest:
    post:
      tags: [chunks]
      summary: Consolidated cheap "has anything changed" check
      description: |
        Cheap check for whether anything new has happened, scoped to whatever of
        `session`/`stream` (both optional and independent) the caller currently has
        selected — one request per live-poll tick instead of one per concern (a global
        latest session id, a session's latest sgid/streams_version, and a stream's latest
        stid all in one response). Omit `session` for only `latest_session_id`; supply
        `session` without `stream` to omit `latest_stid`. Carries no chunk/stream
        payload; intended for a low-overhead live poll rather than as a data-fetching
        endpoint.
      operationId: getLatest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session:
                  type: integer
                  format: int64
                  description: Session ID; omit for latest_session_id only
                stream:
                  type: integer
                  format: int64
                  description: Stream ID; only meaningful together with session
      responses:
        '200':
          description: Latest known ids/counters, scoped to whatever was supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Latest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/i/dbdump/chunk:
    post:
      tags: [chunks]
      summary: Fetch specific chunks by ID
      description: |
        Fetches the raw bytes of an explicitly enumerated list of chunk IDs.
        Returned as `multipart/form-data`; each part corresponds to one chunk.

        Each part has:
        - `Content-Disposition: form-data; name="<chunk-id>"`
        - `Content-Type: application/octet-stream`
        - `X-Chunk-Offset`: byte offset of the chunk's first byte within its
          direction stream (integer, decimal string)
        - `X-Chunk-Time`: capture timestamp in milliseconds since Unix epoch
          (integer, decimal string)
        - Body: raw chunk bytes

        Parts are returned in ascending chunk-ID order. An empty chunk list in
        the request yields an empty multipart response.
      operationId: getChunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session, stream, direction]
              properties:
                session:
                  type: integer
                  format: int64
                  description: Session ID
                stream:
                  type: integer
                  format: int64
                  description: Stream ID
                direction:
                  $ref: '#/components/schemas/Direction'
                chunks:
                  type: array
                  items:
                    type: integer
                    format: int64
                  default: []
                  description: |
                    Chunk IDs to fetch. Omitting it (or supplying an empty array)
                    is a valid, explicitly-handled request — see the empty-response
                    note above, not a `400`.
      responses:
        '200':
          description: Multipart response with one part per chunk
          content:
            multipart/form-data:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/i/dbdump/chunk-stid:
    post:
      tags: [chunks]
      summary: Resolve a per-direction chunk ID to an stid
      description: |
        Each direction within a stream has its own independent chunk counter
        (`id`, starting at 0). The `stid` is a direction-agnostic per-stream
        counter that increases monotonically across both directions. This
        endpoint translates a per-direction `id` into its corresponding `stid`,
        which is required to position `stid-stream` requests.
      operationId: getChunkStid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session, stream, direction, id]
              properties:
                session:
                  type: integer
                  format: int64
                  description: Session ID
                stream:
                  type: integer
                  format: int64
                  description: Stream ID
                direction:
                  $ref: '#/components/schemas/Direction'
                id:
                  type: integer
                  format: int64
                  description: Per-direction chunk ID (0-based)
      responses:
        '200':
          description: The stid of the requested chunk
          content:
            application/json:
              schema:
                type: object
                required: [stid]
                properties:
                  stid:
                    type: integer
                    format: int64
                    description: Stream-local direction-agnostic chunk counter
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No chunk with the given session/stream/direction/id exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/i/dbdump/byte-stid:
    post:
      tags: [chunks]
      summary: Resolve a byte offset to the stid of the containing chunk
      description: |
        Finds the chunk in the given direction whose byte range contains the
        specified offset (i.e. the chunk with the largest `offset` value that
        is still ≤ the requested offset). Returns its `stid` so the caller can
        position an `stid-stream` request to that chunk.
      operationId: getByteStid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session, stream, direction, offset]
              properties:
                session:
                  type: integer
                  format: int64
                  description: Session ID
                stream:
                  type: integer
                  format: int64
                  description: Stream ID
                direction:
                  $ref: '#/components/schemas/Direction'
                offset:
                  type: integer
                  format: int64
                  description: Byte offset within the direction stream (0-based)
      responses:
        '200':
          description: The stid of the chunk containing the given byte offset
          content:
            application/json:
              schema:
                type: object
                required: [stid]
                properties:
                  stid:
                    type: integer
                    format: int64
                    description: Stream-local direction-agnostic chunk counter
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No chunks exist for the given direction (stream has no data in that direction)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/i/dbdump/stid-stream:
    get:
      tags: [chunks]
      summary: Stream chunks for a single stream ordered by stid
      description: |
        Upgrades the connection to WebSocket (`Upgrade: websocket`). Streams
        chunks from a single stream in `stid` order (direction-agnostic).
        Multiple sequential requests may be sent on one connection; the server
        processes them one at a time.

        `stid` is a per-stream direction-agnostic chunk counter that increases
        monotonically across both directions. It allows the frontend to maintain
        a single cursor and receive interleaved c→s and s→c chunks in capture
        order without merging two independent streams.

        **Request frame** (client → server, JSON text):
        ```json
        {"session": N, "stream": N, "start": N, "n": N}
        ```
        - `session` — session ID
        - `stream` — stream ID
        - `start` — first stid to fetch (inclusive, 0-based)
        - `n` — maximum number of chunks to return; `0` means unlimited

        **Per-chunk response** (server → client, two frames per chunk):
        1. Text frame (JSON metadata):
           ```json
           {"stid": N, "chunk-id": N, "direction": N, "time": N, "offset": N}
           ```
           - `stid` — stream-local direction-agnostic chunk index
           - `chunk-id` — per-direction chunk ID (0-based within direction)
           - `direction` — `0` = client→server, `1` = server→client
           - `time` — capture timestamp in milliseconds since Unix epoch
           - `offset` — byte offset of this chunk's first byte within its direction stream
        2. Binary frame: raw chunk bytes

        **Done signal** (server → client, JSON text):
        ```json
        {"done": true}
        ```
        Sent after all matching chunks have been delivered. The client may
        immediately send the next request frame.

        **Error** (server → client, JSON text):
        ```json
        {"error": "<message>"}
        ```
        Sent if a database error occurs; the connection is closed afterwards.
      operationId: stidStream
      responses:
        '101':
          description: Switching Protocols — WebSocket connection established
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/i/dbdump/sgid-stream:
    get:
      tags: [chunks]
      summary: Stream chunks for an entire session ordered by sgid
      description: |
        Upgrades the connection to WebSocket (`Upgrade: websocket`). Streams
        chunks across all streams in a session in `sgid` order.
        Multiple sequential requests may be sent on one connection.

        `sgid` is a session-global direction-agnostic chunk counter that
        increases monotonically across all streams in a session. It is used by
        the combined-stream view to display traffic from multiple streams
        interleaved in capture order.

        **Request frame** (client → server, JSON text):
        ```json
        {"session": N, "start": N, "n": N}
        ```
        - `session` — session ID
        - `start` — first sgid to fetch (inclusive, 0-based)
        - `n` — maximum number of chunks to return; `0` means unlimited

        **Per-chunk response** (server → client, two frames per chunk):
        1. Text frame (JSON metadata):
           ```json
           {"sgid": N, "stream": N, "chunk-id": N, "direction": N, "time": N, "offset": N}
           ```
           - `sgid` — session-global direction-agnostic chunk index
           - `stream` — stream ID the chunk belongs to
           - `chunk-id` — per-direction chunk ID (0-based within direction)
           - `direction` — `0` = client→server, `1` = server→client
           - `time` — capture timestamp in milliseconds since Unix epoch
           - `offset` — byte offset of this chunk's first byte within its direction stream
        2. Binary frame: raw chunk bytes

        **Done signal** (server → client, JSON text):
        ```json
        {"done": true}
        ```

        **Error** (server → client, JSON text):
        ```json
        {"error": "<message>"}
        ```
        Sent if a database error occurs; the connection is closed afterwards.
      operationId: sgidStream
      responses:
        '101':
          description: Switching Protocols — WebSocket connection established
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/i/dbdump/segments:
    get:
      tags: [chunks]
      summary: Fetch a budgeted run of raw chunks ("segments") in stid order, forward or backward
      description: |
        Upgrades the connection to WebSocket (`Upgrade: websocket`). Answers
        one request with exactly one response (one metadata text frame
        immediately followed by one binary frame) — unlike `stid-stream`,
        there is no per-chunk streaming and no `done` signal; the pair *is*
        the complete response. Multiple sequential requests may be sent on
        one connection; the server processes them one at a time.

        Every returned item is always a raw chunk — this endpoint has no
        frame-awareness at all. Backs the backend half of a hex-view rework
        described in `doc/design/hexview-segment-buffer.md`; the frontend
        migration that will also route framer scripts' byte fetches through
        this endpoint (slicing frame ranges out of the chunks it returns) is
        not done yet — framer scripts still fetch bytes via `stid-stream`
        today.

        **Request frame** (client → server, JSON text):
        ```json
        {"session": N, "stream": N, "afterStid": N, "maxSegments": N, "maxBytes": N}
        ```
        or
        ```json
        {"session": N, "stream": N, "beforeStid": N, "maxSegments": N, "maxBytes": N}
        ```
        - `session` / `stream` — session and stream ID
        - `afterStid` / `beforeStid` — **exactly one of these two fields must
          be given**; that alone selects scan direction (there is no separate
          `direction` field, deliberately — see below). `afterStid` walks
          `stid` ascending, exclusive of the given value. `beforeStid` walks
          `stid` descending, exclusive of the given value, then the server
          re-sorts the result ascending before responding, so the client never
          needs to special-case direction when consuming the response. A
          request with both or neither set is rejected.
        - `maxSegments` — maximum number of chunks to return; `<= 0` means
          unlimited
        - `maxBytes` — soft byte budget: chunks are added whole, and both caps
          are only checked *after* adding one — so a single maximal chunk can
          push the response slightly past `maxBytes` (bounded overshoot, up to
          one chunk's own size; this endpoint never truncates a chunk).
          `<= 0` means unlimited

        No `direction` field is used for scan direction (unlike `afterStid`/
        `beforeStid` above) to avoid colliding with the unrelated per-segment
        `direction` (client→server vs. server→client) already used throughout
        this response.

        **Response** (server → client, one text frame then one binary frame):
        1. Text frame (JSON metadata):
           ```json
           {"segments": [{"stid": N, "segmentId": N, "direction": N, "time": N, "offset": N, "length": N}, ...], "reachedEnd": bool}
           ```
           - `segments` — one entry per included chunk, in ascending `stid`
             order regardless of scan direction
             - `stid` — stream-local direction-agnostic chunk index
             - `segmentId` — per-direction chunk ID (0-based within direction)
             - `direction` — `0` = client→server, `1` = server→client
             - `time` — capture timestamp in milliseconds since Unix epoch
             - `offset` — byte offset of this chunk's first byte within its direction stream
             - `length` — this chunk's own byte count (not cumulative) —
               reconstructing each chunk's slice from the binary frame is one
               linear pass accumulating `length` in array order
           - `reachedEnd` — for a forward request, `true` means no chunks
             exist after `afterStid`; for a backward request, `true` means no
             chunks exist before `beforeStid` (i.e. the very start of the
             stream was reached)
        2. Binary frame: every listed segment's own bytes, concatenated in the
           same order as the `segments` array (possibly empty if `segments` is
           empty)

        **Error** (server → client, JSON text, no binary frame follows):
        ```json
        {"error": "<message>"}
        ```
        Sent for a malformed request (both or neither of `afterStid`/
        `beforeStid` given) or a database error; the connection is closed
        afterwards.
      operationId: segments
      responses:
        '101':
          description: Switching Protocols — WebSocket connection established
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/i/dbdump/search-text:
    post:
      tags: [search]
      summary: Search for a pattern across captured traffic
      description: |
        Searches the raw bytes stored in the `chunks` table for occurrences of
        a pattern. The search can be scoped to a single stream or run across all
        streams in a session, and can be restricted to one direction.

        **Contiguous vs. non-contiguous mode**

        In the default non-contiguous mode each chunk is searched independently;
        a pattern that spans a chunk boundary will not be found.

        With `"contiguous": true` the chunks are concatenated into 1 MB batches
        before searching. Literal patterns carry a `len(pattern)−1` byte overlap
        between consecutive batches so that matches split across a batch boundary
        are still found. For regex patterns no overlap is applied (the minimum
        match length is not known in advance), so a regex match spanning a 1 MB
        batch boundary may be missed.

        **Pattern encoding**

        | `pattern_encoding` | Meaning |
        |---|---|
        | `""` or `"text"` | `pattern` is a raw UTF-8 string; searched as literal bytes |
        | `"base64"` | `pattern` is base64-encoded; decoded to raw bytes before searching |
        | `"regex"` | `pattern` is a Go `regexp` expression; compiled and matched with `FindAllIndex` |

        The web frontend always uses `"base64"` for non-regex formats so that
        arbitrary byte sequences (UTF-16, hex, null bytes) can be transported
        safely through the JSON body.

        **Pattern length limit:** for `pattern_encoding` `""`/`"text"`/`"base64"`, the
        *decoded* pattern is capped at 4096 bytes; a longer pattern is rejected with
        `400`, regardless of `contiguous`. `"regex"` patterns have no such cap.
      operationId: searchText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session, pattern]
              properties:
                session:
                  type: integer
                  format: int64
                  description: Session ID to search within
                stream:
                  type: integer
                  format: int64
                  description: |
                    Stream ID to restrict the search to. If omitted, all streams
                    in the session are searched.
                start:
                  type: integer
                  format: int64
                  description: |
                    Lower bound on the byte offset (inclusive). Only chunks whose
                    range overlaps `[start, end)` are considered. Default: `0`.
                end:
                  type: integer
                  format: int64
                  description: |
                    Upper bound on the byte offset (exclusive). Must be greater
                    than `start` if supplied.
                pattern:
                  type: string
                  description: |
                    The search pattern. Interpretation depends on
                    `pattern_encoding`.
                pattern_encoding:
                  type: string
                  enum: ['', text, base64, regex]
                  default: text
                  description: |
                    How `pattern` should be interpreted:
                    - `""` / `"text"` — raw UTF-8 literal bytes
                    - `"base64"` — base64-encoded arbitrary byte sequence
                    - `"regex"` — Go `regexp` syntax
                direction:
                  $ref: '#/components/schemas/Direction'
                  description: |
                    Restrict search to one direction. If omitted, both directions
                    are searched independently.
                contiguous:
                  type: boolean
                  default: false
                  description: |
                    If `true`, chunks are concatenated before searching so that
                    patterns spanning chunk boundaries can be found.
      responses:
        '200':
          description: |
            Array of matches ordered by stream, then direction, then byte offset.
            An empty array means no matches were found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchMatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/i/dbdump/scripts:
    get:
      tags: [framer]
      summary: List stored framer scripts
      description: |
        Metadata only, no script bodies, so listing stays cheap. Returns `501`
        if the `dbdump` interceptor wasn't configured with `scripts-dir`.
      operationId: listFramerScripts
      responses:
        '200':
          description: All stored scripts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScriptInfo'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/i/dbdump/scripts/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-][A-Za-z0-9_. -]*[A-Za-z0-9_-]$|^[A-Za-z0-9_-]$'
        description: |
          Script name, without the `.js` extension. Letters, digits, `_`, `-`,
          `.`, and spaces only; must not start/end with `.` or a space, and
          must not be exactly `.` or `..`.
    get:
      tags: [framer]
      summary: Fetch a framer script's content
      operationId: getFramerScript
      responses:
        '200':
          description: Raw script source
          content:
            application/javascript:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
    put:
      tags: [framer]
      summary: Create or overwrite a framer script
      description: |
        Writes the request body verbatim as `<name>.js` (atomically — never
        observable as a partial write). Also purges any other persisted frame
        index version for this script name (see `/frames` below), keeping
        only the version matching the newly-written content's sha256 hash —
        a previous version can never be reached again once overwritten.
      operationId: putFramerScript
      requestBody:
        required: true
        content:
          application/javascript:
            schema:
              type: string
      responses:
        '204':
          description: Script written
        '400':
          $ref: '#/components/responses/BadRequest'
        '501':
          $ref: '#/components/responses/NotImplemented'
    delete:
      tags: [framer]
      summary: Delete a framer script
      description: Also purges every persisted frame index version for this script name.
      operationId: deleteFramerScript
      responses:
        '204':
          description: Script deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/i/dbdump/frame-progress:
    post:
      tags: [framer]
      summary: How far a framer script has processed one stream direction
      description: |
        Reports the persisted progress for one (session, stream, direction,
        script, script_version) key, so a browser-run framer knows whether it
        needs to compute anything beyond what's already stored. A key with no
        rows yet is not an error — `processed_offset: 0` and `state: null`
        just mean framing hasn't started for it.
      operationId: getFrameProgress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrameKey'
      responses:
        '200':
          description: Current progress for the given key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameProgress'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/i/dbdump/frames:
    post:
      tags: [framer]
      summary: List persisted frames for one stream direction
      description: |
        Frames are returned in `id` order, `id >= start`. Together with
        `frame-progress` this is what will let `HexDump` render a framed
        partitioning of a stream alongside the raw per-chunk one, once a
        framer script has processed it.
      operationId: listFrames
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FrameKey'
                - type: object
                  required: [start, n]
                  properties:
                    start:
                      type: integer
                      format: int64
                      description: First frame id to return (inclusive)
                    n:
                      type: integer
                      description: Maximum number of frames to return; 0 or negative means unlimited
      responses:
        '200':
          description: Frames with id >= start, ordered by id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Frame'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/i/dbdump/frames/timeline:
    post:
      tags: [framer]
      summary: List persisted frames for a stream across *both* directions, merged chronologically
      description: |
        The cross-direction counterpart to `/frames`: same script, both
        directions at once, ordered by `stid` (a value inherited from
        whichever raw chunk each frame completes on) rather than by
        `id` — `id` alone isn't comparable across directions, and isn't
        even unique within one `stid` (a single raw chunk producing
        several frames at once — routine, not an edge case — makes them
        tie on `stid`; such ties are broken by `id`, which is safe
        precisely because ties are always within one direction: two
        different chunks, from either direction, never share a `stid`).
        The server guarantees a page never splits such a tied group, so
        `start = the last returned frame's stid + 1` is always a safe
        cursor for the next page — and symmetrically for `beforeStid`
        below, `beforeStid = the first returned frame's stid` continues
        further backward with nothing skipped or duplicated.

        **Exactly one of `start` (forward, inclusive) or `beforeStid`
        (backward, exclusive) must be given** — mirrors `/segments`'
        `afterStid`/`beforeStid` convention (see that endpoint's own
        description for why scan direction is picked this way rather
        than a separate `direction` field). A request with both or
        neither is rejected with `400`. Backward results are still
        returned in ascending `(stid, id)` order, same as forward, so a
        caller never special-cases which direction produced a page.
      operationId: listFramesTimeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FrameTimelineKey'
                - type: object
                  required: [n]
                  properties:
                    start:
                      type: integer
                      format: int64
                      description: First stid to return (inclusive) — forward scan
                    beforeStid:
                      type: integer
                      format: int64
                      description: Scan backward for frames with stid strictly less than this value
                    n:
                      type: integer
                      description: Maximum number of frames to return; 0 or negative means unlimited
      responses:
        '200':
          description: >-
            Frames with stid >= start (forward) or stid < beforeStid
            (backward), always ordered ascending by (stid, id)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Frame'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/i/dbdump/frames/append:
    post:
      tags: [framer]
      summary: Extend a framer script's persisted frame index by one computed batch
      description: |
        Atomically: asserts `expected_processed_offset` still matches what's
        stored (0 if framing hasn't started for this key yet), assigns
        `new_frames` sequential ids continuing from whatever's already
        stored, and advances progress to
        `new_processed_offset`/`new_state`. There is deliberately no
        retry/CAS-defense beyond that one offset check — the browser UI
        enforces a single writer per key, so a `409` here always means a
        client bug, not a real race to resolve gracefully.
      operationId: appendFrames
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FrameKey'
                - type: object
                  required: [expected_processed_offset, new_frames, new_processed_offset]
                  properties:
                    expected_processed_offset:
                      type: integer
                      format: int64
                      description: Must match the currently-stored processed_offset, or the request is rejected
                    new_frames:
                      type: array
                      items:
                        $ref: '#/components/schemas/FrameInput'
                    new_processed_offset:
                      type: integer
                      format: int64
                    new_state:
                      type: string
                      contentEncoding: base64
                      description: Opaque framer state to persist alongside the new progress; omit/null for no state
      responses:
        '204':
          description: Frames appended and progress advanced
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/i/dbdump/frames/clear:
    post:
      tags: [framer]
      summary: Enforce "at most one framing view per stream"
      description: |
        Deletes every persisted `frames`/`frame_progress` row for the given
        stream (both directions) whose `(script, script_version)` isn't the
        one given here. Meant to be called before *every* framing run (not
        just on a script edit/delete, unlike the automatic cleanup a script
        `PUT`/`DELETE` triggers — see `intercept/dbdump/CLAUDE.md`'s
        `purgeOtherFrameVersions`), so a stream can never end up with more
        than one script's — or one script version's — frame data at once,
        regardless of how the previous run's script changed (a different
        script picked, a new version of the same script, or even a script
        file edited directly on disk, invisible to the `PUT`-triggered
        cleanup). A request whose `(script, script_version)` matches what's
        already stored for this stream is a no-op — that data is left intact
        so the caller can resume framing from its existing progress instead
        of reprocessing from scratch.
      operationId: clearStreamFrames
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrameTimelineKey'
      responses:
        '204':
          description: Cleared (or already only this (script, script_version) was present)
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/i/tamper/control:
    get:
      tags: [tamper]
      summary: Single control connection for live traffic interception
      description: |
        Upgrades the connection to WebSocket (`Upgrade: websocket`). Only one
        control connection is allowed at a time; a second attempt is rejected
        with an `error` frame and the connection is closed. All commands and
        notifications for every stream flow through this one connection —
        per-stream mode toggles and held-chunk resolution included, not just
        lifecycle events.

        With no control connection active, every stream on this interceptor
        behaves as pure pass-through (watch mode, no watchers, zero overhead)
        — unless the interceptor is configured with `hold-until-connected`,
        in which case every chunk is held (bounded by `hold-timeout-ms`)
        until a control client connects, so traffic is never silently missed
        while nothing is attached yet.

        A held chunk is appended to a growing, editable byte buffer kept per
        `(conn, direction)` — not addressed by its own id. No bytes ever flow
        over this connection — `held` and `stream-list` are metadata only. To
        read a direction's currently-held bytes, connect to that stream's
        `/api/i/tamper/watch` connection and send a `peek` command.

        **Proxy → client** (JSON text frame):
        - ```json
          {"type": "stream-created", "conn": N, "src": "...", "dst": "..."}
          ```
        - ```json
          {"type": "stream-terminated", "conn": N}
          ```
        - ```json
          {"type": "held", "conn": N, "direction": N, "offset": N, "length": N, "time": N}
          ```
          Sent when a stream in intercept mode appends a new chunk to a
          direction's held buffer. `direction`: `0` = client→server, `1` =
          server→client. `offset`/`length` describe just this new chunk
          (where it starts within the buffer, and its size) — not the
          buffer's total size — so a client can extend its own
          locally-tracked view of the buffer incrementally rather than
          re-`peek`ing on every arrival; `offset` also doubles as a
          consistency check against that local view. `time` is milliseconds
          since the Unix epoch. Fetch the actual bytes via `peek` on
          `/watch`.
        - ```json
          {"type": "stream-list", "streams": [{"conn": N, "src": "...", "dst": "...", "intercepting": bool, "pending": [{"direction": N, "chunks": N, "length": N}]}]}
          ```
          Reply to a `list-streams` command. `pending` has 0-2 entries — one
          per direction with something currently held, summarized as chunk
          count + total byte length (not itemized per chunk) — this is what
          makes reconnecting to control at any time a full resync rather than
          just a feed of future events, e.g. after `hold-until-connected`
          held traffic before anyone was connected to see the original
          `held` push.
        - ```json
          {"type": "ok", "command": "set-auto-intercept" | "set-mode" | "release" | "drop-connection"}
          ```
          Acknowledges that command succeeded. Each of those four commands
          gets exactly one `ok` or `error` reply — never both, never neither.
          `script-log` (below) is the one command type that gets neither on
          success — it's fire-and-forget.
        - ```json
          {"type": "error", "message": "..."}
          ```
          Sent for: an unrecognized command type; missing required fields;
          `set-mode`/`release`/`drop-connection` against an unknown stream;
          `release` whose `prefix_length` exceeds the buffer's actual current
          length (e.g. a hold-timeout already flushed it) or whose
          `release_chunks` exceeds the resulting chunk count; or `script-log`
          with a `level` other than `"log"`/`"error"`. The connection is not
          closed.

        **Client → proxy** (JSON text frame; `release` with `"edited": true`
        must be immediately followed by a binary frame with the replacement
        bytes for `prefix_length`):
        - ```json
          {"type": "set-auto-intercept", "enabled": bool}
          ```
          Sets the mode newly-established connections start in. Does not
          affect streams that already exist.
        - ```json
          {"type": "set-mode", "conn": N, "intercepting": bool}
          ```
          Switches one stream between watch and intercept mode. Switching to
          `false` immediately force-releases (forwards, unmodified)
          everything currently held for that stream, rather than leaving it
          to time out.
        - ```json
          {"type": "release", "conn": N, "direction": N, "edited": bool, "prefix_length": N, "bounds": [N, ...], "release_chunks": N, "action": "forward" | "drop"}
          ```
          Combines an optional edit with an optional release of one
          direction's held buffer, in one atomic step. `edited: false` means
          "release `release_chunks` chunks of the buffer exactly as it
          stands" (`prefix_length`/`bounds` are ignored). `edited: true`
          replaces the buffer's first `prefix_length` bytes — as the client
          last knew them — with the bytes in the following binary frame,
          whose internal chunk boundaries are given by `bounds` (a list of
          byte offsets, `bounds[0]` always `0`), before releasing.
          `prefix_length` anchors the edit against the buffer's actual
          current length: a stale value (e.g. a hold-timeout flushed the
          buffer in the meantime) is rejected rather than silently
          misapplied. `release_chunks` `0` means "edit only, release
          nothing" (a real supported mode, not just a corner case).
          `action: "forward"` releases the real bytes; `action: "drop"`
          removes the released chunks from the buffer without forwarding
          them. Unresolved held buffers are also auto-released, unmodified,
          after the configured `hold-timeout-ms` (or immediately, if this
          control connection disconnects).
        - ```json
          {"type": "drop-connection", "conn": N, "direction": N}
          ```
          Terminates the connection outright, independent of `release` —
          dropping the connection isn't parameterized by buffer content the
          way an edit/release is, so it's its own command rather than a
          third `release` action value. `direction` just identifies which
          buffer the client was looking at; either direction's buffer kills
          the whole connection.
        - ```json
          {"type": "list-streams"}
          ```
          Requests a `stream-list` snapshot of every currently active stream.
        - ```json
          {"type": "script-log", "level": "log" | "error", "text": "..."}
          ```
          Pushes one already-formatted line from a running script's log (see
          the "Scripts" sub-tab / `scriptRuntime.js`) for optional
          server-side persistence — see `GET /api/i/tamper/log-file`. A
          no-op if the interceptor wasn't configured with `log-file`.
          `text` may itself span multiple lines. Fire-and-forget: no `ok`
          reply on success, only `error` for an invalid `level`.
      operationId: tamperControl
      responses:
        '101':
          description: Switching Protocols — WebSocket connection established
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/i/tamper/watch:
    get:
      tags: [tamper]
      summary: Live mirror of one stream's traffic, plus on-demand reads of held buffers
      description: |
        Upgrades the connection to WebSocket (`Upgrade: websocket`). Any
        number of clients may attach to the same stream at once. This
        connection is never a decision-maker — forward/edit/drop/
        drop-connection decisions only ever happen on
        `/api/i/tamper/control`; this connection only ever reads.

        **Live mirror** (server → client, unsolicited, best-effort — a client
        that can't keep up simply misses frames rather than slowing down the
        proxy): every chunk actually forwarded on the stream (both watch-mode
        pass-through and released held buffers), as two frames:
        1. Text frame (JSON metadata):
           ```json
           {"direction": N, "time": N, "length": N}
           ```
        2. Binary frame: raw chunk bytes

        **`peek`** (client → server): the only way to read a direction's
        currently-held (not-yet-released) bytes. Fetches the *whole* buffer
        for that direction, optionally sliced.
        ```json
        {"type": "peek", "direction": N, "offset": N, "length": N}
        ```
        - `direction` — required, `0` or `1`.
        - `offset`, `length` — optional byte-range slice of the buffer
          (`length` `0` or omitted means "to the end").

        Reply is exactly one of the following pairs, terminated by a
        `peek-done` frame:
        1. Text frame (JSON metadata):
           ```json
           {"type": "pending", "direction": N, "time": N, "offset": N, "length": N, "total_length": N, "bounds": [N, ...]}
           ```
           `offset`/`length` describe the slice actually returned;
           `total_length` and `bounds` always describe the *whole* buffer
           regardless of what was sliced, since a resync always wants the
           complete picture and both are cheap. A direction with nothing
           currently held is a normal zero-length reply here, not an error.
        2. Binary frame: the (possibly sliced) buffer bytes

        Then:
        ```json
        {"type": "peek-done"}
        ```

        If `direction` was invalid, the reply is a single error frame
        instead:
        ```json
        {"type": "error", "message": "..."}
        ```
      operationId: tamperWatch
      parameters:
        - name: conn
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: ConnID of the stream to mirror
      responses:
        '101':
          description: Switching Protocols — WebSocket connection established
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No stream with the given conn id is currently active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/i/tamper/log-file:
    get:
      tags: [tamper]
      summary: Whether a script log file is configured, and its display name
      description: |
        Static for the interceptor's whole lifetime (set once at startup from
        the `log-file` config arg), so a plain one-shot GET is enough — no
        push event to track. Used by the "Scripts" sub-tab to show "Logged to
        `<filename>`" in place of the manual Download button when a
        connected script's log output is also being persisted server-side
        (see the `script-log` control command above).
      operationId: getLogFileInfo
      responses:
        '200':
          description: Log file status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogFileInfo'

  /api/i/tamper/scripts:
    get:
      tags: [scripts]
      summary: List stored scripts
      description: |
        Storage layer for a planned programmatic, callback-driven alternative to
        manual control-client decisions (JavaScript run in a browser Web
        Worker — see CLAUDE.md's "Script storage" section). Metadata only, no
        script bodies, so listing stays cheap. Returns `501` if the `tamper`
        interceptor wasn't configured with `scripts-dir`.
      operationId: listScripts
      responses:
        '200':
          description: All stored scripts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScriptInfo'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/i/tamper/scripts/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-][A-Za-z0-9_. -]*[A-Za-z0-9_-]$|^[A-Za-z0-9_-]$'
        description: |
          Script name, without the `.js` extension. Letters, digits, `_`, `-`,
          `.`, and spaces only; must not start/end with `.` or a space, and
          must not be exactly `.` or `..`.
    get:
      tags: [scripts]
      summary: Fetch a script's content
      operationId: getScript
      responses:
        '200':
          description: Raw script source
          content:
            application/javascript:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
    put:
      tags: [scripts]
      summary: Create or overwrite a script
      description: |
        Writes the request body verbatim as `<name>.js` (atomically — never
        observable as a partial write) and pushes a `script-updated` event on
        the control WebSocket so a connected browser can react without
        polling.
      operationId: putScript
      requestBody:
        required: true
        content:
          application/javascript:
            schema:
              type: string
      responses:
        '204':
          description: Script written
        '400':
          $ref: '#/components/responses/BadRequest'
        '501':
          $ref: '#/components/responses/NotImplemented'
    delete:
      tags: [scripts]
      summary: Delete a script
      description: Also pushes a `script-updated` event on the control WebSocket.
      operationId: deleteScript
      responses:
        '204':
          description: Script deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/i/tamper/fs/list:
    get:
      tags: [fs]
      summary: List fs-root's top-level contents
      description: |
        Equivalent to `GET /fs/list/{path}` with an empty path — lists
        `fs-root` itself, via the same handler (so the same `400`/`404` failure
        modes apply, e.g. if `fs-root` is removed or becomes unreadable after
        startup). One directory level, not recursive (a `dir: true` entry is
        listed again by requesting that path). Returns `501` if the `tamper`
        interceptor wasn't configured with `fs-root`.
      operationId: listFsRoot
      responses:
        '200':
          description: Directory entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FsEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/i/tamper/fs/list/{path}:
    parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: >-
          Path of a subdirectory relative to `fs-root`. May itself contain
          further `/`-separated segments (each percent-encoded individually
          by clients, not the path as a whole); resolved and
          containment-checked server-side — see CLAUDE.md's "Filesystem
          access" section.
    get:
      tags: [fs]
      summary: List a subdirectory's contents
      description: One directory level, not recursive.
      operationId: listFsDir
      responses:
        '200':
          description: Directory entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FsEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/i/tamper/fs/file/{path}:
    parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: >-
          Path of a file relative to `fs-root`. May itself contain further
          `/`-separated subdirectory segments (each percent-encoded
          individually by clients); resolved and containment-checked
          server-side.
    get:
      tags: [fs]
      summary: Read a file's content
      operationId: getFsFile
      responses:
        '200':
          description: Raw file bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
    put:
      tags: [fs]
      summary: Create or overwrite a file
      description: >-
        Writes the request body verbatim (atomically — never observable as a
        partial write). Missing parent directories under `fs-root` are
        created automatically.
      operationId: putFsFile
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: File written
        '400':
          $ref: '#/components/responses/BadRequest'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [fs]
      summary: Append to a file
      description: >-
        Appends the request body verbatim, creating the file (and any missing
        parent directories under `fs-root`) if it doesn't exist yet. `POST`,
        not `PUT`, because appending isn't idempotent — repeating the request
        appends again, unlike `PUT`'s overwrite. Safe under concurrent
        appends to the same file (opened with `O_APPEND`; see CLAUDE.md's
        "Filesystem access" section).
      operationId: appendFsFile
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Content appended
        '400':
          $ref: '#/components/responses/BadRequest'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /ui:
    get:
      tags: [ui]
      summary: Redirect to web UI
      operationId: uiRedirect
      responses:
        '302':
          description: Redirect to /ui/
          headers:
            Location:
              schema:
                type: string
                example: /ui/

  /ui/:
    get:
      tags: [ui]
      summary: Embedded web frontend
      description: |
        Serves the embedded Preact-based traffic viewer. All assets (JS, vendor
        modules) are available under `/ui/` and are embedded in the binary at
        build time.
      operationId: uiIndex
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string

components:
  schemas:

    Session:
      type: object
      required: [id, start, config]
      properties:
        id:
          type: integer
          format: int64
          description: Session ID (auto-increment, globally unique)
        start:
          type: integer
          format: int64
          description: Session start time in milliseconds since Unix epoch
        config:
          type: object
          description: |
            JSON snapshot of the proxy configuration at session start
            (proxy name, listen/connect endpoints, mode, TLS config,
            interceptor list).
          additionalProperties: true

    Stream:
      type: object
      required: [id, session, src, dst, start, end, length0, length1]
      properties:
        id:
          type: integer
          format: int64
          description: |
            Stream ID — equals the proxy's connection counter (`ConnID`).
            Sequential and 0-based per proxy run; unique only within a session.
        session:
          type: integer
          format: int64
          description: ID of the session this stream belongs to
        src:
          type: string
          description: Client endpoint (host:port)
          example: 127.0.0.1:54321
        dst:
          type: string
          description: Upstream endpoint (host:port)
          example: 93.184.216.34:443
        start:
          type: integer
          format: int64
          description: Connection start time in milliseconds since Unix epoch
        end:
          type: integer
          format: int64
          description: Connection end time in milliseconds since Unix epoch; 0 if the connection is still ongoing
        length0:
          type: integer
          format: int64
          description: Total captured bytes in the client→server direction; -1 if no data captured
        length1:
          type: integer
          format: int64
          description: Total captured bytes in the server→client direction; -1 if no data captured

    ChunkList:
      type: object
      required: [latest0, latest1, length0, length1]
      properties:
        latest0:
          type: integer
          format: int64
          description: ID of the most recent chunk in the client→server direction; -1 if no chunks exist
        latest1:
          type: integer
          format: int64
          description: ID of the most recent chunk in the server→client direction; -1 if no chunks exist
        length0:
          type: integer
          format: int64
          description: Total captured bytes in the client→server direction; -1 if no chunks exist
        length1:
          type: integer
          format: int64
          description: Total captured bytes in the server→client direction; -1 if no chunks exist

    Latest:
      type: object
      required: [latest_session_id, latest_sgid, streams_version, latest_stid]
      properties:
        latest_session_id:
          type: integer
          format: int64
          description: Highest session id across every capture session; -1 if none exist. Always computed, independent of the request body.
        latest_sgid:
          type: integer
          format: int64
          description: Highest sgid (direction-agnostic, session-global chunk counter) captured so far anywhere in the session; -1 if `session` was omitted or it has no chunks yet
        streams_version:
          type: integer
          format: int64
          description: |
            In-memory counter bumped whenever a stream is added to the requested session
            or an existing one closes. -1 if `session` was omitted, or isn't the one this
            interceptor instance is actively capturing to (a past session's stream list
            is immutable, so -1 is a stable, never-"changed" value for it).
        latest_stid:
          type: integer
          format: int64
          description: Highest stid (direction-agnostic, per-stream chunk counter) captured so far for the requested stream; -1 if `stream` (or `session`) was omitted, or the stream has no chunks yet

    SearchMatch:
      type: object
      required: [stream, direction, offset, stid]
      properties:
        stream:
          type: integer
          format: int64
          description: Stream ID in which the match was found
        direction:
          $ref: '#/components/schemas/Direction'
        offset:
          type: integer
          format: int64
          description: Byte offset of the first matching byte within the direction stream
        stid:
          type: integer
          format: int64
          description: |
            `stid` of the chunk that contains the start of the match. Can be
            used directly as the `start` parameter of an `stid-stream` request
            to position the view at this match.

    Direction:
      type: integer
      enum: [0, 1]
      description: |
        Traffic direction:
        - `0` — client → server (upstream)
        - `1` — server → client (downstream)

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message

    ScriptInfo:
      type: object
      required: [name, size]
      properties:
        name:
          type: string
          description: Script name, without the `.js` extension
        size:
          type: integer
          format: int64
          description: Size of the script's content in bytes

    FsEntry:
      type: object
      required: [name, dir, size]
      properties:
        name:
          type: string
          description: Entry name (not a full path)
        dir:
          type: boolean
          description: Whether this entry is a subdirectory
        size:
          type: integer
          format: int64
          description: >-
            Size in bytes for a file; meaningless (whatever the OS reports)
            for a directory — key off `dir` instead

    LogFileInfo:
      type: object
      required: [enabled, filename]
      properties:
        enabled:
          type: boolean
          description: Whether the `tamper` interceptor was configured with `log-file`
        filename:
          type: string
          description: >-
            Basename (not the full configured path) of the log file; empty
            when `enabled` is `false`

    FrameKey:
      type: object
      required: [session, stream, direction, script, script_version]
      properties:
        session:
          type: integer
          format: int64
          description: Session ID
        stream:
          type: integer
          format: int64
          description: Stream ID
        direction:
          $ref: '#/components/schemas/Direction'
        script:
          type: string
          description: Framer script name (without the `.js` extension)
        script_version:
          type: string
          description: >-
            sha256 hex digest of the script's content, computed client-side —
            a content change is simply a different (and initially absent) key,
            not something requiring explicit staleness detection

    FrameTimelineKey:
      type: object
      required: [session, stream, script, script_version]
      properties:
        session:
          type: integer
          format: int64
          description: Session ID
        stream:
          type: integer
          format: int64
          description: Stream ID
        script:
          type: string
          description: Framer script name (without the `.js` extension)
        script_version:
          type: string
          description: sha256 hex digest of the script's content — see FrameKey's own field for the full rationale

    FrameProgress:
      type: object
      required: [processed_offset]
      properties:
        processed_offset:
          type: integer
          format: int64
          description: >-
            How many bytes of the direction stream have been framed so far;
            0 if framing hasn't started yet for this key
        state:
          type: string
          contentEncoding: base64
          description: >-
            The framer script's own opaque persisted state, for resuming;
            null if none

    Frame:
      type: object
      required: [id, offset, length, direction, stid, time]
      properties:
        id:
          type: integer
          format: int64
          description: Sequential id, 0-based, assigned server-side, per direction
        offset:
          type: integer
          format: int64
          description: Byte offset of the frame's first byte within the direction stream
        length:
          type: integer
          format: int64
        meta:
          type: string
          description: >-
            Free-form data the framer script attached to this frame (e.g. a
            "kind" tag); opaque to the server, stored/returned as-is; null if
            none
        direction:
          $ref: '#/components/schemas/Direction'
          description: >-
            Redundant with the request's own key for `/frames` (which is
            already scoped to one direction); the field that actually matters
            for `/frames/timeline`, whose key spans both
        stid:
          type: integer
          format: int64
          description: >-
            Inherited from whichever raw chunk this frame completes on — the
            cross-direction ordering key `/frames/timeline` sorts by. Ties
            (multiple frames completing on the same chunk) are routine, not
            an edge case, and are always within one direction (two different
            chunks, from either direction, never share a `stid`) — broken by
            `id`
        time:
          type: integer
          format: int64
          description: >-
            Capture timestamp (milliseconds since Unix epoch) of whichever raw
            chunk this frame completes on — frames have no timestamp of their
            own, since they're computed, not captured

    FrameInput:
      type: object
      required: [offset, length, stid, time]
      properties:
        offset:
          type: integer
          format: int64
        length:
          type: integer
          format: int64
        meta:
          type: string
          description: Opaque free-form data to attach to this frame; omit/null for none
        stid:
          type: integer
          format: int64
          description: >-
            The stid of whichever raw chunk this frame completes on — the
            caller already has this in hand for every raw chunk it fetched to
            compute the frame, no extra lookup needed
        time:
          type: integer
          format: int64
          description: >-
            The time of that same completing chunk — see Frame's own `time`
            field

  responses:

    BadRequest:
      description: Invalid or malformed request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: Database or server-side error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: The request's expected prior state no longer matches what's stored
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotImplemented:
      description: The feature isn't configured/enabled on this interceptor instance
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
